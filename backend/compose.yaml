services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=${DB_NAME:-whyql}'
      - 'POSTGRES_USER=${DB_USER:-whyql}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-whyql}'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    volumes:
      # Historical volume key: the pg data volume predates the WhyQL rename
      # (renaming the key would allocate an empty volume and "lose" the data).
      - 'askdata-postgres:/var/lib/postgresql/data'
  redis:
    image: 'redis:8'
    ports:
      - '6379:6379'
    volumes:
      - 'whyql-redis:/data'
  kafka:
    # Single-node KRaft broker for dev; topics/DLQs arrive in Phase 5.
    image: 'apache/kafka-native:latest'
    ports:
      - '9092:9092'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      # Single-node dev cluster: internal LogDirs/topics must use RF=1.
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1'
      - 'KAFKA_DEFAULT_REPLICATION_FACTOR=1'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      - 'CLUSTER_ID=MkU3OEVBOTkwNTJENDM2Qg'
    volumes:
      - 'whyql-kafka:/var/lib/kafka/data'
  mailhog:
    # Dev SMTP sink; UI on http://localhost:8025.
    image: 'mailhog/mailhog:v1.0.1'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  # Historical volume keys (pre-WhyQL-rename); renaming would allocate
  # empty volumes and orphan the existing data.
  askdata-postgres:
  whyql-redis:
  whyql-kafka:
